name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Not --all-extras: stumpy drags in numba, whose wheels lag new Python
      # releases, and mypy is configured to tolerate the absent stubs anyway.
      - run: >-
          uv sync --dev
          --extra pandas --extra polars --extra pyarrow
          --extra stats --extra sklearn --extra viz
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: >-
          uv sync --dev
          --extra pandas --extra polars --extra pyarrow
          --extra stats --extra sklearn --extra viz
      - name: pytest
        run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # The adapters over stumpy and ruptures skip themselves when the extra is
  # absent, so exercise them somewhere. Pinned to 3.12: numba's wheels lag new
  # Python releases and ruptures caps itself below 3.14.
  heavy-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: >-
          uv sync --dev
          --extra pandas --extra polars --extra pyarrow
          --extra stats --extra mp --extra cpd
      - name: pytest
        run: uv run pytest -q

  # The core promise is "narwhals + numpy only". Importing is not enough to prove
  # it: a detector that emits its result through a dataframe would only fail on
  # the way out. So this runs detection end to end and checks nothing optional
  # got imported along the way.
  minimal-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --no-dev --no-default-groups
      - name: detect end to end without optional dependencies
        run: |
          uv run python -c "
          import sys
          import numpy as np
          import hazure
          from hazure import (
              Graph, HampelDetector, LevelShiftDetector, Node, OrAggregator,
              PeltDetector, SpectralResidualDetector, SpikeDetector, TimeSeries,
          )

          forbidden = {'pandas', 'polars', 'pyarrow', 'scipy', 'sklearn',
                       'matplotlib', 'statsmodels', 'stumpy', 'ruptures', 'numba'}
          leaked = forbidden & set(sys.modules)
          assert not leaked, f'importing hazure pulled in {leaked}'

          time = np.arange(400, dtype=np.int64) * 3_600_000_000_000
          values = np.zeros(400)
          values[200] = 9.0
          values[300:] += 4.0
          series = TimeSeries.from_arrays(time, values)

          for detector in (
              SpikeDetector(window=24),
              LevelShiftDetector(window=12),
              HampelDetector(window=25),
              PeltDetector(),
              SpectralResidualDetector(),
          ):
              result = detector.fit_detect(series)
              assert result.n_rows == 400, type(detector).__name__

          graph = Graph([
              Node('spike', SpikeDetector(window=24)),
              Node('shift', LevelShiftDetector(window=12)),
              Node('either', OrAggregator(), inputs=('spike', 'shift')),
          ])
          assert graph.fit_detect(series).n_rows == 400

          leaked = forbidden & set(sys.modules)
          assert not leaked, f'detecting pulled in {leaked}'
          print('ok:', hazure.__version__)
          "
