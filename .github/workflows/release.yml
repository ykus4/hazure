name: Release

# Building happens on every tag and on demand; publishing happens only for a
# tag, and only through the `pypi` environment.
#
# Before the first release, PyPI needs a trusted publisher configured for this
# repository, this workflow filename and the `pypi` environment name. That is
# what lets the publish step authenticate with an OIDC token instead of a
# long-lived API token nobody can rotate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # A tag that disagrees with the version in pyproject.toml publishes a file
      # nobody can trace back to the commit it came from.
      - name: the tag and the version have to agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF#refs/tags/v}"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - run: uv build

      # The wheel has to stand up outside this repository: installed on its own,
      # with no source tree and no dev group, importing and detecting.
      - name: the wheel works on its own
        run: |
          uv run --isolated --no-project --with "$(echo dist/*.whl)" python -c "
          import sys
          import numpy as np
          import hazure
          from hazure import (
              PotThreshold, SpikeDetector, Stream, TimeSeries, budget_threshold,
          )
          from hazure.datasets import compare, make_series
          from hazure.scoring import DeviationScorer

          forbidden = {'pandas', 'polars', 'pyarrow', 'scipy', 'sklearn',
                       'matplotlib', 'statsmodels', 'stumpy', 'ruptures', 'numba'}
          assert not forbidden & set(sys.modules), forbidden & set(sys.modules)

          step = 3_600_000_000_000
          time = np.arange(4000, dtype=np.int64) * step
          values = np.random.default_rng(0).normal(0, 1, 4000)
          values[2000] = 40.0
          series = TimeSeries.from_arrays(time, values)

          detector = SpikeDetector(window=24).fit(series)
          assert detector.detect(series).n_rows == 4000

          # Streaming, the EVT fence, calibration and the sample data all reach
          # outside the core in ways importing alone would not reveal.
          stream = Stream(detector, history=48).prime(series)
          assert stream.update(int(time[-1]) + step, 99.0) == 1.0

          scores = DeviationScorer().fit_score(series)
          fence = PotThreshold(high=1e-3).fit(scores)
          assert np.isfinite(fence.high_) and fence.update(1.0) == 0.0
          assert budget_threshold(scores, alerts=1, per='7d').cut_off > 0

          planted = make_series('spike', n=1000, n_anomalies=2)
          assert planted.events.n_events == 2
          assert 'recall' in compare({'s': SpikeDetector(window=24)}, planted)['s']

          assert not forbidden & set(sys.modules), forbidden & set(sys.modules)
          print('ok:', hazure.__version__)
          "

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hazure
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
