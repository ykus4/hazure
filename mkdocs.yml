site_name: hazure
site_description: >-
  Rule-based and unsupervised anomaly detection for time series, on narwhals and
  numpy alone.
site_url: https://ykus4.github.io/hazure/
repo_url: https://github.com/ykus4/hazure
repo_name: ykus4/hazure
copyright: MIT licensed

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.top
    - search.highlight
    # One sidebar, not two: the page's own headings hang off the page in the
    # left-hand tree rather than in a separate right-hand column.
    - toc.follow
    - toc.integrate
  palette:
    # A theme toggle rather than a fixed scheme, so the code blocks and the
    # diagrams stay legible either way.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide: guide.md
  - How it works:
      - algorithms/index.md
      - Rolling comparisons: algorithms/rolling.md
      - Univariate scores: algorithms/univariate.md
      - Thresholds: algorithms/thresholds.md
      - Multivariate scores: algorithms/multivariate.md
      - Method families: algorithms/methods.md
      - Events and metrics: algorithms/evaluation.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  # $ ... $ and $$ ... $$ handed to MathJax, configured in
  # docs/javascripts/mathjax.js.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Graph.to_mermaid() output pasted into a page renders as a diagram
        # rather than as source, the same way it does on GitHub.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Warnings, which `mkdocs build --strict` in CI turns into failures: a heading
# renamed out from under a cross-reference should break the build, not ship.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_options:
              # Attributes and Parameters are documented on the class, and the
              # numpydoc parser is strict about indentation; warn rather than
              # fail the build so a formatting slip is visible but not fatal.
              ignore_init_summary: true
            filters:
              - "!^_"
            members_order: source
            inherited_members: false
            group_by_category: true
            heading_level: 3
