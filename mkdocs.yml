site_name: hazure
site_description: >-
  Rule-based and unsupervised anomaly detection for time series, on narwhals and
  numpy alone.
site_url: https://ykus4.github.io/hazure/
repo_url: https://github.com/ykus4/hazure
repo_name: ykus4/hazure
copyright: MIT licensed

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    # A theme toggle rather than a fixed scheme, so the code blocks and the
    # diagrams stay legible either way.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guide: guide.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Graph.to_mermaid() output pasted into a page renders as a diagram
        # rather than as source, the same way it does on GitHub.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_options:
              # Attributes and Parameters are documented on the class, and the
              # numpydoc parser is strict about indentation; warn rather than
              # fail the build so a formatting slip is visible but not fatal.
              ignore_init_summary: true
            filters:
              - "!^_"
            members_order: source
            inherited_members: false
            group_by_category: true
            heading_level: 3
